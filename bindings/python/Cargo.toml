[package]
name = "finalytics-py"
description = "Python bindings for Finalytics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "_finalytics"
crate-type = ["cdylib"]

[dependencies]
finalytics = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py310"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Threads natively; Pyodide, Python in WebAssembly, runs on one thread.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
finalytics = { workspace = true, features = ["parallel"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
