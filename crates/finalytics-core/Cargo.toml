[package]
name = "finalytics-core"
description = "Foundations for Finalytics: dates, calendars, currencies, time series and numerical helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# JSON Schema descriptions of the public types, for the bindings and documentation.
schema = ["dep:schemars"]
# Independent pieces of work spread over threads with rayon; off for WebAssembly.
parallel = ["dep:rayon"]

[dependencies]
rust_decimal = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
