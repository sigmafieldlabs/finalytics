[package]
name = "finalytics-formats"
description = "CSV and JSON import and export for Finalytics, with validation reports and the versioned portfolio document."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# JSON Schema descriptions of the public types, for the bindings and documentation.
schema = [
  "dep:schemars",
  "finalytics-core/schema",
  "finalytics-ledger/schema",
  "finalytics-plan/schema",
]

[dependencies]
finalytics-core = { workspace = true }
finalytics-ledger = { workspace = true }
finalytics-plan = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
schemars = { workspace = true, optional = true }

[lints]
workspace = true
