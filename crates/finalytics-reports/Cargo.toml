[package]
name = "finalytics-reports"
description = "Report data for Finalytics: holdings, performance, risk, overview, attribution and scenario reports with chart-ready series, provenance and export tables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# JSON Schema descriptions of the public types, for the bindings and documentation.
schema = [
    "dep:schemars",
    "finalytics-core/schema",
    "finalytics-ledger/schema",
    "finalytics-formats/schema",
    "finalytics-perf/schema",
    "finalytics-risk/schema",
    "finalytics-opt/schema",
    "finalytics-backtest/schema",
    "finalytics-plan/schema",
]

[dependencies]
finalytics-core = { workspace = true }
finalytics-ledger = { workspace = true }
finalytics-formats = { workspace = true }
finalytics-perf = { workspace = true }
finalytics-risk = { workspace = true }
finalytics-opt = { workspace = true }
finalytics-backtest = { workspace = true }
finalytics-plan = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
schemars = { workspace = true, optional = true }

[lints]
workspace = true
