[package]
name = "finalytics-opt"
description = "Portfolio optimisation for Finalytics: convex formulations, risk parity, hierarchical risk parity, frontiers and rebalancing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# JSON Schema descriptions of the public types, for the bindings and documentation.
schema = ["dep:schemars", "finalytics-core/schema", "finalytics-ledger/schema", "finalytics-perf/schema", "finalytics-risk/schema"]
# Independent fits and solves spread over threads; off for WebAssembly.
parallel = ["finalytics-core/parallel"]

[dependencies]
finalytics-core = { workspace = true }
finalytics-ledger = { workspace = true }
finalytics-perf = { workspace = true }
finalytics-risk = { workspace = true }
clarabel = { workspace = true }
libm = { workspace = true }
serde = { workspace = true }
web-time = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
