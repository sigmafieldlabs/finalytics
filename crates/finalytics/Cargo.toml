[package]
name = "finalytics"
description = "Portfolio analytics: accounting, performance, risk, optimisation and reports, for Rust, Python and WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
# The tests are left out: they read the shared test data elsewhere in the repository. The
# datasets and the examples are included.
include = ["/src", "/data", "/examples", "/LICENSE-*"]

[features]
default = ["io", "parallel"]
# Reading portfolios and prices from files by path, and showing reports in a browser. The
# engine itself performs no input or output; the WebAssembly package leaves this out.
io = []
# Comparisons, walk-forward fits, resampling, frontiers, plans and screens spread over threads
# with rayon, with the same results on any number of threads. The WebAssembly package leaves this out.
parallel = [
    "finalytics-core/parallel",
    "finalytics-risk/parallel",
    "finalytics-opt/parallel",
    "finalytics-backtest/parallel",
    "finalytics-plan/parallel",
]
# JSON Schema descriptions of the public types, for the bindings and documentation.
schema = [
    "dep:schemars",
    "finalytics-core/schema",
    "finalytics-ledger/schema",
    "finalytics-formats/schema",
    "finalytics-perf/schema",
    "finalytics-risk/schema",
    "finalytics-opt/schema",
    "finalytics-reports/schema",
    "finalytics-backtest/schema",
    "finalytics-plan/schema",
]

[dependencies]
finalytics-core = { workspace = true }
finalytics-ledger = { workspace = true }
finalytics-formats = { workspace = true }
finalytics-perf = { workspace = true }
finalytics-risk = { workspace = true }
finalytics-opt = { workspace = true }
finalytics-reports = { workspace = true }
finalytics-backtest = { workspace = true }
finalytics-plan = { workspace = true }
libm = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rayon = { workspace = true }

[lints]
workspace = true
