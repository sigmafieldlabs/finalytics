[package]
name = "finalytics"
description = "Portfolio analytics: accounting, performance, risk, optimisation and reports, for Rust, Python and WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
# The tests are left out: they read the shared test data elsewhere in the repository.
include = ["/src", "/LICENSE-*"]

[features]
# JSON Schema descriptions of the public types, for the bindings and documentation.
schema = [
    "finalytics-core/schema",
    "finalytics-ledger/schema",
    "finalytics-formats/schema",
    "finalytics-perf/schema",
    "finalytics-risk/schema",
    "finalytics-opt/schema",
    "finalytics-reports/schema",
]

[dependencies]
finalytics-core = { workspace = true }
finalytics-ledger = { workspace = true }
finalytics-formats = { workspace = true }
finalytics-perf = { workspace = true }
finalytics-risk = { workspace = true }
finalytics-opt = { workspace = true }
finalytics-reports = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
