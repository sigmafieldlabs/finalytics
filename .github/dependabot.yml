version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Used by branch (stable, nightly, master); the minimum supported Rust version is an
      # input of the action, not a version of it.
      - dependency-name: dtolnay/rust-toolchain
