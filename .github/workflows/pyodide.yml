name: Pyodide

# Builds the Python package for Pyodide, Python on WebAssembly (PEP 783), and tests it there: the
# package's tests, and the guides' Python examples, which must print what they print natively.
# It runs on changes to the engine or the Python package, by hand from the Actions tab, and from
# the Release workflow, whose run keeps the wheel for the GitHub release. PyPI does not take
# Pyodide wheels.
#
# A Pyodide release fixes its Python, Emscripten and Rust versions. pyodide-build reads them from
# the cross-build environment of PYODIDE_VERSION, the release the guides' pages run on, and
# installs Emscripten with Pyodide's patches.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "bindings/python/**"
      - "docs/examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pyodide.yml"
  pull_request:
    paths:
      - "crates/**"
      - "bindings/python/**"
      - "docs/examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pyodide.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYODIDE_VERSION: "314.0.7"
  PYODIDE_BUILD_VERSION: "0.39.3"

jobs:
  wheel:
    name: Build and test the Pyodide wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pyodide-build and Pyodide's cross-build environment
        run: |
          python -m pip install "pyodide-build==$PYODIDE_BUILD_VERSION"
          pyodide xbuildenv install "$PYODIDE_VERSION"
          echo "Python $(pyodide config get pyversion), Emscripten $(pyodide config get pyodide_emscripten_version), ABI $(pyodide config get pyodide_abi_version)"
      - name: Install the Rust toolchain Pyodide builds with
        run: |
          toolchain=$(pyodide config get rust_toolchain)
          url=$(pyodide config get rust_emscripten_target_url)
          rustup toolchain install "$toolchain" --profile minimal
          if [ -z "$url" ]; then
            rustup target add wasm32-unknown-emscripten --toolchain "$toolchain"
          else
            # Pyodide builds Rust's standard library for its own Emscripten settings: use it.
            rustlib="$(rustup run "$toolchain" rustc --print sysroot)/lib/rustlib"
            archive="$RUNNER_TEMP/$(basename "$url")"
            curl --fail --silent --show-error --location --output "$archive" "$url"
            rm -rf "$rustlib/wasm32-unknown-emscripten"
            python -c 'import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])' "$archive" "$rustlib"
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Build the wheel
        working-directory: bindings/python
        run: pyodide build --outdir dist
      - name: Install the wheel in a Pyodide environment
        run: |
          pyodide venv .venv-pyodide
          .venv-pyodide/bin/python -m pip install numpy pandas pytest jsonschema
          .venv-pyodide/bin/python -m pip install finalytics --no-index --no-deps --find-links bindings/python/dist
      - name: Run the package's tests in Pyodide
        run: .venv-pyodide/bin/python -m pytest bindings/python/tests
      - name: Run the guides' Python examples in Pyodide
        run: python scripts/guides.py --languages python --python .venv-pyodide/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: pyodide-wheel
          path: bindings/python/dist/*.whl
