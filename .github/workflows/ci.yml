name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format, lint and consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --lib --bins --tests --benches -- -D warnings
      - name: Lint the examples, which print their results
        run: cargo clippy --workspace --examples -- -D warnings -A clippy::print_stdout
      - name: Check versions, licences and the READMEs, and run the README's Rust examples
        run: python3 scripts/check-consistency.py --run-examples
      - name: Check that the schema and the generated types are current
        run: |
          cargo run -p finalytics-codegen -- --check
          python3 scripts/generate-types.py --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude finalytics-py

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude finalytics-py

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: cargo build --workspace --exclude finalytics-py --target wasm32-unknown-unknown
      - name: Run the tests in a WebAssembly runtime
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p finalytics-wasm --target wasm32-unknown-unknown
      - run: bindings/wasm/build.sh
      - name: Check the size of the engine
        run: |
          size=$(gzip -9 -c bindings/wasm/pkg/finalytics_bg.wasm | wc -c)
          echo "The engine is $size bytes gzipped (budget 2 MiB)"
          test "$size" -le 2097152
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the npm package in Node
        run: node --test bindings/wasm/test/*.test.mjs
      - name: Type-check the TypeScript declarations
        run: npx --yes -p typescript@5.9.3 tsc -p bindings/wasm/test

  budgets:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Check the native budgets
        run: cargo run --release -p finalytics-bench --bin budgets -- --write-document large.json
      - run: bindings/wasm/build.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the WebAssembly budget
        run: node bindings/wasm/test/budget.mjs large.json

  python:
    name: Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin
      - name: Build and install the wheel
        working-directory: bindings/python
        run: |
          maturin build --release --out dist
          pip install dist/*.whl pytest pandas jsonschema
      - run: pytest bindings/python/tests

  deny:
    name: Dependencies (licences and advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --exclude finalytics-py
