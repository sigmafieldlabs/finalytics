name: Release

# Publishes the Python package to PyPI when a version tag (v1.0.0, v1.0.0-rc.1, ...) is pushed.
# Run it by hand from the Actions tab to build and test the wheels without publishing them.
# crates.io and npm are published by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the version in Cargo.toml
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: Linux arm64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { name: Linux x86_64 musl, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, musl: true }
          - { name: Linux arm64 musl, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, musl: true }
          - { name: macOS arm64, runner: macos-14, target: aarch64 }
          - { name: macOS x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: Windows x64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist
      - name: Test the wheel
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          python -m pip install bindings/python/dist/*.whl pytest pandas jsonschema
          python -m pytest bindings/python/tests
      - name: Test the wheel on Alpine Linux
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.13-alpine sh -c \
            'pip install bindings/python/dist/*.whl && python -c "import finalytics; print(finalytics.__version__)"'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: bindings/python/dist/*.whl

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations need trusted publishing; this workflow uses an API token.
          attestations: false
          skip-existing: true
